name: Discord - assignations

on:
  issues:
    types: [assigned, unassigned]
  pull_request:
    types: [assigned, unassigned]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer la notification Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          REPO: ${{ github.repository }}
          KIND: ${{ github.event_name == 'pull_request' && 'PR' || 'Issue' }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          if [ "$ACTION" = "assigned" ]; then
            verb="assigné(e) à"
            color=3066993
          else
            verb="retiré(e) de"
            color=15158332
          fi

          payload=$(jq -n \
            --arg title "[$REPO] $KIND #$NUMBER : $TITLE" \
            --arg url "$URL" \
            --arg desc "**$ASSIGNEE** a été $verb ce(tte) $KIND par **$ACTOR**." \
            --argjson color "$color" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: $color}]}')

          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
